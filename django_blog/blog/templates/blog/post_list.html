{% extends "blog/base.html" %}

{% block content %}
    <h2>Recent Blog Posts</h2>
    {% for post in posts %}
        <article class="content-section">
            <div class="article-metadata">
                <a class="mr-2" href="#">{{ post.author }}</a>
                <small class="text-muted">{{ post.published_date|date:"F d, Y" }}</small>
            </div>
            <h2><a class="article-title" href="{% url 'post-detail' post.pk %}">{{ post.title }}</a></h2>
            
            <p class="article-content">{{ post.content|truncatewords:30 }}</p>

            <div class="mb-3">
                {% for tag in post.tags.all %}
                    <a href="{% url 'tagged' tag.slug %}" class="badge badge-info p-2">{{ tag.name }}</a>
                {% endfor %}
            </div>
            
            <hr>
        </article>
    {% endfor %}
{% endblock %}
