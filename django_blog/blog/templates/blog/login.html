{% extends "blog/base.html" %}
{% load static %}

{% block content %}
<div class="form-container">
    <h2>Login</h2>
    {% if form.errors %}
        <p class="error-msg">Your username and password didn't match. Please try again.</p>
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
</div>
{% endblock %}
