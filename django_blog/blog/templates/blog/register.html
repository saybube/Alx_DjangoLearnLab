{% extends "blog/base.html" %}
{% load static %}

{% block content %}
<div class="form-container">
    <h2>Create an Account</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Register</button>
    </form>
    <div class="form-footer">
        <small>Already have an account? <a href="{% url 'login' %}">Login here</a></small>
    </div>
</div>
{% endblock %}
