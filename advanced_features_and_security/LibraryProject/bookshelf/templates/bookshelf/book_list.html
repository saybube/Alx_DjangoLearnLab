<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
</head>
<body>
    <h1>Library Collection</h1>

    <form method="get" action="{% url 'book_list' %}">
        {{ form.as_p }}
        <button type="submit">Search</button>
    </form>

    <hr>

    <ul>
        {% for book in books %}
            <li>{{ book.title }} by {{ book.author }} ({{ book.publication_year }})</li>
        {% empty %}
            <li>No books match your search.</li>
        {% endfor %}
    </ul>
</body>
</html>
